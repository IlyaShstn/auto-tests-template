[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --clean-alluredir
markers =
    api: API-тесты (requests + pytest)
    ui: UI-тесты (Playwright)
    smoke: дымовые тесты — быстрый набор для проверки после деплоя
